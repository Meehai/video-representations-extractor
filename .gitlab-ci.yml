image: python:3.12-bookworm

variables:
  GIT_LFS_SKIP_SMUDGE: "1"
  CACHE_COMPRESSION_LEVEL: "fastest" # checkpoints don't compress: don't spend time trying

.weights_cache: &weights_cache
  key: weights-v1-$CI_JOB_NAME
  paths:
    - vre_repository/**/weights/
  unprotect: true # master (protected) and MR branches share the cache
  when: always # keep what was downloaded even if the tests fail

workflow:
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
    when: always
  - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'master'
    when: always
  - when: never

before_script:
  - apt-get update
  - apt-get install -y ffmpeg fonts-open-sans graphviz
  # resources/test_video.mp4 is LFS-tracked and GIT_LFS_SKIP_SMUDGE=1 is set above, so CI
  # checks out a text pointer; download the real video so the e2e tests can use it directly.
  - curl -fL "https://gitlab.com/open-visual-robotics/video-representations-extractor/-/raw/master/resources/test_video.mp4" -o resources/test_video.mp4
  - export VRE_ROOT=`pwd`
  - export VRE_WEIGHTS_DIR=$VRE_ROOT/weights
  - export VRE_LOGLEVEL=3
  - export PATH="$PATH:$VRE_ROOT/cli"
  # vre + vre_repository with the CPU-only torch build (setup.py is the single source of truth for deps)
  - pip install -e ".[cpu]" --extra-index-url https://download.pytorch.org/whl/cpu
  - pip install pylint==4.1.4 pytest pytest-rerunfailures

pages:
  # docs site is built by opdoc (docs/build_docs.sh), not sphinx: README + docs/source + the API of
  # vre/ and vre_repository/ into public/, which GitLab Pages serves. A broken prose link fails it.
  script:
    - pip install -e ".[docs]"
    - bash docs/build_docs.sh public
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

pylint:
  # vendored packages under pkg/ are pinned as-is (their own repos lint them) -- not our code.
  script:
    - python -m pylint --rcfile=.pylintrc $(git ls-files "*.py" | grep -v "test/\|examples/\|pkg/") $(git ls-files cli/)

vre_unit_integration:
  before_script:
    - apt-get update
    - apt-get install -y ffmpeg fonts-open-sans graphviz
    - export VRE_ROOT=`pwd`
    - export VRE_WEIGHTS_DIR=$VRE_ROOT/weights
    - export VRE_LOGLEVEL=3
    - export VRE_COLORIZE_SEMSEG_FAST=1
    - export PATH="$PATH:$VRE_ROOT/cli"
    - pip install -e ".[cpu]" --extra-index-url https://download.pytorch.org/whl/cpu
    - pip install pytest pytest-rerunfailures
  script:
    - python3 -m pytest test/vre --durations=15

vre_repository_unit:
  cache: *weights_cache
  script:
    - python3 -m pytest test/vre_repository/unit --durations=15

vre_repository_integration:
  cache: *weights_cache
  script:
    - python3 -m pytest test/vre_repository/integration test/vre_repository/end_to_end --durations=15

vre_repository_e2e_batched:
  cache: *weights_cache
  script:
    - bash test/vre_repository/end_to_end/vre_batched/run.sh

vre_repository_e2e_task_mapped:
  cache: *weights_cache
  script:
    - bash test/vre_repository/end_to_end/task_mapped_representations/run.sh

vre_repository_e2e_streaming:
  cache: *weights_cache
  script:
    - bash test/vre_repository/end_to_end/vre_streaming/run.sh
