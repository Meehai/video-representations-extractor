image: python:3.11-bookworm

variables:
  GIT_LFS_SKIP_SMUDGE: "1"

workflow:
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
    when: always
  - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'master'
    when: always
  - when: never

before_script:
  - apt-get update
  - apt-get install -y ffmpeg fonts-open-sans graphviz
  # resources/test_video.mp4 is LFS-tracked and GIT_LFS_SKIP_SMUDGE=1 is set above, so CI
  # checks out a text pointer; download the real video so the e2e tests can use it directly.
  - curl -fL "https://gitlab.com/open-visual-robotics/video-representations-extractor/-/raw/master/resources/test_video.mp4" -o resources/test_video.mp4
  - export VRE_ROOT=`pwd`
  - export VRE_WEIGHTS_DIR=$VRE_ROOT/weights
  - export VRE_LOGLEVEL=3
  - export PATH="$PATH:$VRE_ROOT/cli"
  - pip install -e .          # base deps from setup.py (no requirements*.txt anymore)
  # CPU-only torch first, so the repository extra below skips the CUDA build.
  - pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu
  - pip install -e ".[repository]"   # heavy model deps; torch already satisfied by the CPU wheel
  - pip install pylint==3.2.7 pytest pytest-rerunfailures

pages:
  # docs site is built by pdoc (docs/build_docs.sh), not sphinx. The script auto-installs pdoc and
  # emits the static site into public/, which GitLab Pages serves.
  script:
    - bash docs/build_docs.sh public
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

pylint:
  # vendored packages under pkg/ are pinned as-is (their own repos lint them) -- not our code.
  script:
    - python -m pylint --rcfile=.pylintrc $(git ls-files "*.py" | grep -v "test/\|examples/\|pkg/") $(git ls-files cli/)

vre_unit_integration:
  before_script:
    - apt-get update
    - apt-get install -y ffmpeg fonts-open-sans graphviz
    - export VRE_ROOT=`pwd`
    - export VRE_WEIGHTS_DIR=$VRE_ROOT/weights
    - export VRE_LOGLEVEL=3
    - export VRE_COLORIZE_SEMSEG_FAST=1
    - export PATH="$PATH:$VRE_ROOT/cli"
    - pip install -e .          # core deps; vre-video + image_utils are vendored in pkg/ now
    - pip install pytest pytest-rerunfailures
  script:
    - python3 -m pytest test/vre

vre_repository_unit:
  script:
    - python3 -m pytest test/vre_repository/unit

vre_repository_integration:
  script:
    - python3 -m pytest test/vre_repository/integration test/vre_repository/end_to_end

vre_repository_e2e_batched:
  script:
    - bash test/vre_repository/end_to_end/vre_batched/run.sh

vre_repository_e2e_task_mapped:
  script:
    - bash test/vre_repository/end_to_end/task_mapped_representations/run.sh

vre_repository_e2e_streaming:
  script:
    - bash test/vre_repository/end_to_end/vre_streaming/run.sh
